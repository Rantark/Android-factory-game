name: Build APK

# Every push (any branch) and every manual "Run workflow" builds the APK AND
# publishes it as a GitHub Release tagged with the version from version.properties.
# Pull requests only build (the APK is attached to the run as an artifact).
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]      # the release step creates tags; don't re-trigger on them
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # never kill a run halfway through publishing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the Android + core modules are needed in CI (skips the desktop dev launcher).
      CI_ANDROID_ONLY: "1"
      # Becomes the APK's versionCode so each build installs as an upgrade of the last.
      FF_BUILD_NUMBER: ${{ github.run_number }}
      # Exposed at job level so the signing step's `if:` can test for it.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and choose release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "::error::version.properties has no version= line"; exit 1; fi
          TAG="v$VERSION"
          # Already released this version? Still publish, with the build number appended.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"
            echo "::notice::v$VERSION already exists; publishing this build as $TAG (bump version.properties for a clean tag)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version $VERSION → tag $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so every release installs as an upgrade over the
      # previous one (keeping save games). See README "Release signing".
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "FF_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run simulation unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        env:
          FF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/android-release.apk "dist/FactoryFlow-$TAG.apk"
          # Stable file name so .../releases/latest/download/FactoryFlow.apk always works.
          cp android/build/outputs/apk/release/android-release.apk dist/FactoryFlow.apk
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoryFlow-${{ env.TAG }}
          path: dist/FactoryFlow-${{ env.TAG }}.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Factory Flow $VERSION** (build $GITHUB_RUN_NUMBER)

          **Install on Android:** open this page on your phone, tap **FactoryFlow.apk** below,
          then allow "Install unknown apps" for your browser when asked.

          Always-newest direct link:
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/FactoryFlow.apk

          Built from \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`.
          EOF
          gh release create "$TAG" dist/FactoryFlow.apk "dist/FactoryFlow-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Factory Flow $TAG" \
            --notes-file notes.md \
            --latest
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "Published $URL"
          {
            echo "## ✅ Published $TAG"
            echo ""
            echo "- Release page: $URL"
            echo "- Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/FactoryFlow.apk"
          } >> "$GITHUB_STEP_SUMMARY"
