name: Build APK

# main pushes and manual runs build AND publish a GitHub Release.
# Pull requests only build (the APK is attached to the run as an artifact).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the Android + core modules are needed in CI (skips the desktop dev launcher).
      CI_ANDROID_ONLY: "1"
      # Becomes versionCode / versionName (1.0.<run>) so each release upgrades the last.
      FF_BUILD_NUMBER: ${{ github.run_number }}
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so every release installs as an upgrade over the
      # previous one (keeping save games). See README "Release signing".
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "FF_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run simulation unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        env:
          FF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/android-release.apk "dist/FactoryFlow-v${VERSION}.apk"
          # Stable file name so .../releases/latest/download/FactoryFlow.apk always works.
          cp android/build/outputs/apk/release/android-release.apk dist/FactoryFlow.apk
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoryFlow-v${{ env.VERSION }}
          path: dist/FactoryFlow-v${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Factory Flow v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            **Install on Android:** open this page on your phone and tap **FactoryFlow.apk** below,
            then allow "Install unknown apps" for your browser when prompted.

            Direct link (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/FactoryFlow.apk

            Built from ${{ github.sha }} on `${{ github.ref_name }}`.
          files: |
            dist/FactoryFlow.apk
            dist/FactoryFlow-v${{ env.VERSION }}.apk
